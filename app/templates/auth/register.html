{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block crumbs %}<span>/</span><span>Регистрация</span>{% endblock %}
{% block content %}
<div class="auth-box">
    <h1>Регистрация</h1>
    <form method="post" class="form">
        <label>ФИО*<input type="text" name="full_name" required></label>
        <label>Логин*<input type="text" name="username" required></label>
        <label>Электронная почта*<input type="email" name="email" required></label>
        <label>Подразделение
            <select name="department_id">
                <option value="">— не указано —</option>
                {% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
            </select>
        </label>
        <label>Пароль* (не менее 5 символов)<input type="password" name="password" required></label>
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
</div>
{% endblock %}
